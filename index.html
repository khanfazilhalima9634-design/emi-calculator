<body>

<h1 id="title">EMI Calculator</h1>
<p id="intro">Calculate EMI using our advanced calculator.</p>

<iframe
  id="calculatorFrame"
  src=""
  style="width:100%; height:900px; border:none;">
</iframe>

<script>
  const params = new URLSearchParams(window.location.search);

  const loan = params.get("loan") || "car-loan";
  const country = params.get("country") || "";

  let file =
    "https://khanfazilhalima9634-design.github.io/Tools/car-loan-emi-calculator.html";

  if (loan === "home-loan") {
    file =
      "https://khanfazilhalima9634-design.github.io/Tools/home-loan-emi-calculator.html";
  }

  if (loan === "global") {
    file =
      "https://khanfazilhalima9634-design.github.io/Tools/global-loan-calculator.html";
  }

  if (country === "germany") {
    file =
      "https://khanfazilhalima9634-design.github.io/Tools/emi-calculator-germany.html";
  }

  document.title = loan.replace(/-/g, " ") + " EMI Calculator";

  document.getElementById("title").innerText =
    loan.replace(/-/g, " ") + " EMI Calculator";

  document.getElementById("intro").innerText =
    "Calculate EMI using our advanced calculator.";

  document.getElementById("calculatorFrame").src = file;
</script>

</body>
