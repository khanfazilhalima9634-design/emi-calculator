<body>

<h1>EMI Calculator</h1>
<p>Calculate EMI using our advanced calculator.</p>

<iframe
  src="https://khanfazilhalima9634-design.github.io/Tools/car-loan-emi-calculator.html"
  style="width:100%; height:900px; border:none;">
</iframe>


<script>
  const params = new URLSearchParams(window.location.search);

  const loan = params.get("loan") || "emi";
  const country = params.get("country") || "global";

  let file = "emi-calculator.html";

  if (loan === "home-loan") {
    file = "home-loan-emi-calculator.html";
  } else if (loan === "car-loan") {
    file = "car-loan-emi-calculator.html";
  } else if (loan === "global") {
    file = "global-loan-calculator.html";
  }

  if (country === "germany") {
    file = "emi-calculator-germany.html";
  }

  document.title = loan.replace(/-/g," ") +
    " EMI Calculator";

  document.getElementById("title").innerText =
    loan.replace(/-/g," ") + " EMI Calculator";

  document.getElementById("intro").innerText =
    "Calculate EMI using our advanced calculator.";

  document.getElementById("calculatorFrame").src = file;
</script>



</body>
