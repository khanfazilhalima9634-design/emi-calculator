<body>

  <h1 id="title"></h1>
  <p id="intro"></p>

  <script>
    // Read URL parts
    const parts = window.location.pathname.split("/").filter(Boolean);

    // Example URL:
    // /emi-calculator/home-loan/india/
    const loan = parts[1] || "personal-loan";
    const country = parts[2] || "usa";

    // Make text readable
    const loanText = loan.replace(/-/g, " ");
    const countryText = country.replace(/-/g, " ");

    // Change page content
    document.title = loanText + " EMI Calculator in " + countryText;

    document.getElementById("title").innerText =
      loanText + " EMI Calculator in " + countryText;

    document.getElementById("intro").innerText =
      "Use this " + loanText + " EMI calculator to calculate monthly EMI in " +
      countryText + ".";
  </script>

</body>
