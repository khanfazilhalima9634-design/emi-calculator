<body>

  <h1 id="title"></h1>
  <p id="intro"></p>

 <script>
  const params = new URLSearchParams(window.location.search);

  const loan = params.get("loan") || "personal-loan";
  const country = params.get("country") || "usa";

  const loanText = loan.replace(/-/g, " ");
  const countryText = country.replace(/-/g, " ");

  document.title = loanText + " EMI Calculator in " + countryText;

  document.getElementById("title").innerText =
    loanText + " EMI Calculator in " + countryText;

  document.getElementById("intro").innerText =
    "Use this " + loanText +
    " EMI calculator to calculate monthly EMI in " +
    countryText + ".";
</script>


</body>
